[project]
name = "patchdistill"
version = "0.1.0"
description = "Prototype experiments for PatchDistill prompt-injection detection."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "scikit-learn",
]

[project.optional-dependencies]
hf = [
  "torch",
  "transformers",
  "accelerate",
]
viz = [
  "matplotlib",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

